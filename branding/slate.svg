<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D8D8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="#3A3A3A" stroke-width="4"/>

  <!-- широкий меловой штрих, чуть неровный -->
  <path d="M133 343 C 197 301, 213 263, 246 236 C 286 202, 323 187, 371 159"
        fill="none" stroke="url(#chalk)" stroke-width="46"
        stroke-linecap="round" filter="url(#rough)"/>

  <!-- крошки мела -->
  <circle cx="377" cy="152" r="16" fill="#FFFFFF"/>
  <circle cx="300" cy="206" r="6" fill="#CFCFCF"/>
  <circle cx="198" cy="306" r="4.5" fill="#BFBFBF"/>
</svg>
