name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JavaFX client
        run: ./mvnw -B verify

      - name: Build collaboration server
        run: ./mvnw -B -f java-collab/server/pom.xml verify
